[project]
name = "disabled-parking"
version = "0.0.0"
description = "A tool to fetch and upload disabled parking data to NIPKaart."
requires-python = ">=3.14,<4.0"
authors = [{ name = "NIPKaart", email = "hello@nipkaart.nl" }]
maintainers = [{ name = "Klaas Schoute", email = "hello@student-techlife.com" }]
license = "MIT"
readme = "README.md"
keywords = ["disabled", "parking", "nipkaart", "locations", "api"]
dependencies = [
  "boto3>=1.40,<2",
  "python-dotenv>=1.0.0,<2.0.0",
  "requests>=2.31.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/nipkaart/disabled-parking"
Repository = "https://github.com/nipkaart/disabled-parking"
Documentation = "https://github.com/nipkaart/disabled-parking"

[dependency-groups]
cities = [
  "antwerpen @ git+https://github.com/klaasnicolaas/python-antwerpen.git@ea4f1283d85c6a3a1c2251ad48fd7f2967181fb4",
  "arnhem @ git+https://github.com/klaasnicolaas/python-arnhem.git@eacfbe3130c0dfbd2bc04e515286656cf13317ea",
  "brussel>=0.2.1,<0.3.0",
  "dresden>=0.2.1,<0.3.0",
  "dusseldorf>=1.0.0,<2.0.0",
  "eindhoven @ git+https://github.com/klaasnicolaas/python-eindhoven.git@f7f5ba3f596aa611ca738c8bee7f479447bdcf79",
  "hamburg>=3.0.0,<4.0.0",
  "koeln @ git+https://github.com/klaasnicolaas/python-koeln.git@a7c7ae8b531c4669ce3ea05021adec1716ef6be5",
  "liege>=1.0.0,<2.0.0",
  "namur @ git+https://github.com/klaasnicolaas/python-namur.git@c29565c3dee5762a4f09002c06df09499617ca02",
  "odp-amsterdam @ git+https://github.com/klaasnicolaas/python-odp-amsterdam.git@7441659dba02366eecbbb2c5a674acee4aede239",
  "async-timeout>=4,<6",
  "odp-stockholm @ git+https://github.com/klaasnicolaas/python-odp-stockholm.git@f14518f5a4edc2ea8b995681013fe3a57ff933fe",
]
dev = [
  "pre-commit==3.8.0",
  "pre-commit-hooks==4.6.0",
  "pylint==3.3.9",
  "ruff==0.17.0",
  "yamllint==1.38.0",
]

[tool.uv]
package = false
default-groups = ["cities", "dev"]

[tool.pylint.BASIC]
good-names = [
  "_",
  "ex",
  "fp",
  "i",
  "id",
  "j",
  "k",
  "on",
  "Run",
  "T",
]

[tool.pylint."MESSAGES CONTROL"]
disable= [
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-positional-arguments", # Same existing constructor convention
  "duplicate-code",
  "format",
  "unsubscriptable-object",
  "broad-except",
]

[tool.pylint.SIMILARITIES]
ignore-imports = true

[tool.pylint.FORMAT]
max-line-length = 88

[tool.pylint.DESIGN]
max-attributes = 20

[tool.ruff]
target-version = "py314"
lint.select = ["ALL"]
lint.ignore = [
  "CPY001", # Copyright is documented in LICENSE, not individual Python files
  "ANN401", # Opinioated warning on disallowing dynamically typed expressions
  "D203", # Conflicts with other rules
  "D213", # Conflicts with other rules
  "D417", # False positives in some occasions
  "PLR2004", # Just annoying, not really useful
  "T201", # Allow the use of print()

  # Conflicts with the Ruff formatter
  "COM812",
  "ISC001",
]

[tool.ruff.lint.flake8-pytest-style]
mark-parentheses = false
fixture-parentheses = false
