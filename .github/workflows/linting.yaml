---
name: Linting

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.11"

jobs:
  tests:
    name: Offline adapter tests
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run package fixture and export tests
        run: uv run --locked python -m unittest discover -s tests -v

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: 🚀 Run Ruff linter
        run: uv run --locked ruff check --output-format=github .
      - name: 🚀 Run Ruff formatter
        run: uv run --locked ruff format --check .

  pre-commit-hooks:
    name: pre-commit-hooks
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: 🚀 Check Python AST
        run: uv run --locked pre-commit run check-ast --all-files
      - name: 🚀 Check for case conflicts
        run: uv run --locked pre-commit run check-case-conflict --all-files
      - name: 🚀 Check docstring is first
        run: uv run --locked pre-commit run check-docstring-first --all-files
      - name: 🚀 Check JSON files
        run: uv run --locked pre-commit run check-json --all-files
      - name: 🚀 Check for merge conflicts
        run: uv run --locked pre-commit run check-merge-conflict --all-files
      - name: 🚀 Check TOML files
        run: uv run --locked pre-commit run check-toml --all-files
      - name: 🚀 Check YAML files
        run: uv run --locked pre-commit run check-yaml --all-files
      - name: 🚀 Check End of Files
        run: uv run --locked pre-commit run end-of-file-fixer --all-files
      - name: 🚀 Trim Trailing Whitespace
        run: uv run --locked pre-commit run trailing-whitespace --all-files

  pylint:
    name: pylint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: 🚀 Run pylint
        run: uv run --locked pre-commit run pylint --all-files

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v6.1.0
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ env.DEFAULT_PYTHON }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: 🚀 Run yamllint
        run: uv run --locked yamllint .
