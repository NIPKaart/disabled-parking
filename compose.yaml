---
services:
  producer:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s
    env_file: .env
    volumes:
      - producer-data:/data
    tmpfs:
      - /tmp
    command:
      - /app/scheduler.py
      - --interval
      - "${PRODUCER_INTERVAL_SECONDS:-86400}"
      - --timeout
      - "300"
      - --lock
      - /data/scheduler.lock
      - --
      - /app/.venv/bin/python
      - /app/producer.py
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  producer-data:
